# ==========================================================================
# Nginx 反向代理配置
#
# 放置位置：
#   Debian/Ubuntu → /etc/nginx/sites-available/imagebed.conf
#   Rocky/CentOS  → /etc/nginx/conf.d/imagebed.conf
#
# 启用后：ln -s /etc/nginx/sites-available/imagebed.conf /etc/nginx/sites-enabled/
# 验证：  nginx -t && systemctl reload nginx
#
# ⚠️ 本项目是「自建图床服务」性质的部署。jsDelivr 官方 ToS 明确禁止
#    把 CDN 当作通用图床存储（Prohibited Use 条目），公共图床场景请改用
#    对象存储（腾讯云 COS / 阿里云 OSS / S3）私有读+ 签名 URL。
#    详见 docs/DEPLOYMENT.md 的「合规提示」一节。
# ==========================================================================

# ---------- HTTP：仅用于 ACME 证书签发与跳转HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name img.example.com;

    # certbot 续期路径
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS 主服务 ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name img.example.com;

    # ---------- TLS ----------
    # 证书路径按实际签发结果替换
    ssl_certificate     /etc/letsencrypt/live/img.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/img.example.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ---------- 安全响应头 ----------
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ---------- 上传体积 ----------
    # 必须 >= 应用层的 MAX_FILE_SIZE，否则大文件会在 Nginx 层被截断，
    # 客户端收到 413 而不是应用返回的清晰错误
    client_max_body_size 10m;

    access_log /var/log/nginx/imagebed.access.log;
    error_log  /var/log/nginx/imagebed.error.log warn;

    # ---------- 限流（与网po和应用层双重保险）----------
    # 定义在 http 块外层，见下方 limit_req_zone 说明
    location /api/v1/upload {
        limit_req zone=upload burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 上传要等 GitHub API，超时放宽
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---------- 图片访问 ----------
    location /i/ {
        #防盗链第一道：Referer 白名单。
        # map 指令需定义在 http 块，这里使用 valid_referers 的简化写法：
        # valid_referers none blocked server_names *.example.com;
        # 命中非白名单时，Nginx 返回 403
        valid_referers none blocked server_names *.example.com;
        if ($invalid_referer) {
            return 403;
        }

        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 图片是不可变资源（内容寻址），可以放心长缓存
        proxy_cache_valid 200 30d;
    }

    # ---------- 其他接口 ----------
    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ==========================================================================
# limit_req_zone 必须定义在 http 块（在 nginx.conf 里，不在本文件）：
#
#   http {
#       limit_req_zone $binary_remote_addr zone=upload:10m rate=30r/m;
#   }
#
# 含义：按客户端 IP 限速，每分钟 30 次，burst 允许突发 10 次。
# 数值需与应用的 RATE_LIMIT_UPLOAD_MAX 保持大致一致。
# ==========================================================================